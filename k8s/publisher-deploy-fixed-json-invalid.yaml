apiVersion: apps/v1
kind: Deployment
metadata:
  name: publisher-fixed-json-invalid
  namespace: pulsar-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: publisher-fixed-json-invalid
  template:
    metadata:
      labels:
        app: publisher-fixed-json-invalid
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "publisher-fixed-json-invalid"
        dapr.io/log-level: "debug"
        dapr.io/volume-mounts: "oauth-credentials-json-invalid:/snp/resources"
    spec:
      volumes:
        - name: oauth-credentials-json-invalid
          configMap:
            name: oauth-credentials-json-invalid
      containers:
      - name: publisher
        image: us-central1-docker.pkg.dev/strong-harbor-338418/elia-sb-debug-mirel/pulsar-bug:latest
        imagePullPolicy: Never
        volumeMounts:
          - name: oauth-credentials-json-invalid
            mountPath: /snp/resources
            readOnly: true
